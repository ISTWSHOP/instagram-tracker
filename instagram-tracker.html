const catConfig = {
  "IA / Claude":              { emoji:"🤖", cls:"cat-ia" },
  "IA / Negócios":            { emoji:"💼", cls:"cat-ia" },
  "IA / Criação de Conteúdo": { emoji:"✍️", cls:"cat-ia" },
  "IA / Workflow":            { emoji:"⚙️", cls:"cat-ia" },
  "IA / Segurança":           { emoji:"🔒", cls:"cat-ia" },
  "Impressão 3D":             { emoji:"🖨️", cls:"cat-3d" },
  "Parques / Disney":         { emoji:"🏰", cls:"cat-parques" },
  "Lifestyle / Motivação":    { emoji:"💰", cls:"cat-lifestyle" },
  "Lifestyle Tech":           { emoji:"🎮", cls:"cat-lifestyle" },
  "Documentos":               { emoji:"📄", cls:"cat-docs" },
  "Indisponível":             { emoji:"❌", cls:"cat-na" }
};
const utilConfig = { "Alta":"util-alta","Média":"util-media","Baixa":"util-baixa","N/A":"util-na" };
const verConfig  = { "Alta":"ver-alta","Média":"ver-media","Baixa":"ver-baixa","Enganoso":"ver-enganoso","N/A":"ver-na" };

function getMainCat(cat) { return cat.startsWith("IA") ? "IA / Claude" : cat; }

function buildFilters() {
  const counts = {"Todos": items.length};
  items.forEach(i => { const mc = getMainCat(i.categoria); counts[mc] = (counts[mc]||0)+1; });
  const order = ["Todos","IA / Claude","Impressão 3D","Parques / Disney","Lifestyle / Motivação","Lifestyle Tech","Documentos","Indisponível"];
  const container = document.getElementById("filters");
  order.forEach(cat => {
    if (!counts[cat]) return;
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (cat==="Todos" ? " active" : "");
    btn.dataset.cat = cat;
    const emoji = catConfig[cat] ? catConfig[cat].emoji+" " : "";
    btn.innerHTML = `${emoji}${cat} <span class="count">${counts[cat]}</span>`;
    btn.onclick = () => { document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); renderCards(); };
    container.appendChild(btn);
  });
}

function buildSummary() {
  const ia = items.filter(i=>i.categoria.startsWith("IA")).length;
  const alta = items.filter(i=>i.utilidade==="Alta").length;
  const verAlta = items.filter(i=>i.veracidade==="Alta").length;
  const cuidado = items.filter(i=>["Baixa","Enganoso"].includes(i.veracidade)).length;
  document.getElementById("summary").innerHTML = `
    <div class="summary-chip">📊 <strong>${items.length}</strong> itens</div>
    <div class="summary-chip">🤖 <strong>${ia}</strong> sobre IA</div>
    <div class="summary-chip">⭐ <strong>${alta}</strong> utilidade alta</div>
    <div class="summary-chip">✅ <strong>${verAlta}</strong> veracidade alta</div>
    <div class="summary-chip">⚠️ <strong>${cuidado}</strong> requerem cuidado</div>`;
}

function renderCards() {
  const activeCat = document.querySelector(".filter-btn.active")?.dataset.cat || "Todos";
  const search = document.getElementById("search").value.toLowerCase();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  let count = 0;
  items.forEach(item => {
    const mc = getMainCat(item.categoria);
    if (activeCat !== "Todos" && mc !== activeCat) return;
    if (search && ![item.conta,item.titulo,item.descricao,item.categoria].join(" ").toLowerCase().includes(search)) return;
    const cfg = catConfig[item.categoria] || { emoji:"📌", cls:"cat-na" };
    const card = document.createElement("div");
    card.className = "card";
    const statsHtml = item.likes !== "—" ? `<div class="stats"><span class="stat">❤️ <span class="num">${item.likes}</span></span><span class="stat">💬 <span class="num">${item.comentarios}</span></span><span class="stat">🔄 <span class="num">${item.shares}</span></span></div>` : '';
    const stepsHtml = (item.passos||[]).map(p=>`<li>${p}</li>`).join("");
    card.innerHTML = `
      <div class="card-top">
        <div class="badges-row">
          <span class="cat-badge ${cfg.cls}">${cfg.emoji} ${item.categoria}</span>
          <span class="util-tag ${utilConfig[item.utilidade]||'util-na'}">★ ${item.utilidade}</span>
          <span class="ver-tag ${verConfig[item.veracidade]||'ver-na'}">✓ ${item.veracidade}</span>
        </div>
        <div class="card-title">${item.titulo}</div>
      </div>
      <div class="card-body">
        <a class="account" href="${item.link}" target="_blank">${item.conta} ↗</a>
        <div class="descricao">${item.descricao}</div>
        ${item.cta !== "N/A" ? `<div class="cta-box">💬 "${item.cta}"</div>` : ''}
        ${statsHtml}
        <button class="expand-btn" onclick="toggle(this)"><span class="arrow">▶</span> Ver análise completa & implementação</button>
        <div class="details">
          <div class="det-section certo"><div class="det-label l-certo">✅ O que está certo</div><div class="det-text">${item.certo}</div></div>
          <div class="det-section errado"><div class="det-label l-errado">⚠️ O que está errado / exagerado</div><div class="det-text">${item.errado}</div></div>
          <div class="det-section"><div class="det-label">🎯 Como usar</div><div class="det-text">${item.uso}</div></div>
          <div class="det-section"><div class="det-label">📋 Passo a passo</div><ol class="impl-steps">${stepsHtml}</ol></div>
          <div class="det-section"><div class="det-label">🔄 Alternativas melhores</div><div class="alt-box">${item.alternativas}</div></div>
          <a class="link-btn" href="${item.link}" target="_blank">🔗 Abrir link original</a>
        </div>
      </div>`;
    grid.appendChild(card);
    count++;
  });
  if (!count) grid.innerHTML = '<div class="empty-state">Nenhum item encontrado.</div>';
}

function toggle(btn) {
  btn.classList.toggle("open");
  btn.nextElementSibling.classList.toggle("show");
}

buildFilters(); buildSummary(); renderCards();
</script>
