const catConfig = {
  "IA / Claude": { emoji: "🤖", cls: "cat-ia" },
  "IA / Negócios": { emoji: "💼", cls: "cat-ia" },
  "IA / Criação de Conteúdo": { emoji: "✍️", cls: "cat-ia" },
  "IA / Workflow": { emoji: "⚙️", cls: "cat-ia" },
  "IA / Segurança": { emoji: "🔒", cls: "cat-ia" },
  "Impressão 3D": { emoji: "🖨️", cls: "cat-3d" },
  "Parques / Disney": { emoji: "🏰", cls: "cat-parques" },
  "Lifestyle / Motivação": { emoji: "💰", cls: "cat-lifestyle" },
  "Lifestyle Tech": { emoji: "🎮", cls: "cat-lifestyle" },
  "Documentos": { emoji: "📄", cls: "cat-docs" },
  "Indisponível": { emoji: "❌", cls: "cat-na" }
};

const utilConfig = {
  "Alta": "util-alta",
  "Média": "util-media",
  "Baixa": "util-baixa",
  "N/A": "util-na"
};

function getMainCat(cat) {
  if (cat.startsWith("IA")) return "IA / Claude";
  return cat;
}

function buildFilters() {
  const counts = {};
  counts["Todos"] = items.length;
  items.forEach(i => {
    const mc = getMainCat(i.categoria);
    counts[mc] = (counts[mc] || 0) + 1;
  });
  const order = ["Todos", "IA / Claude", "Impressão 3D", "Parques / Disney", "Lifestyle / Motivação", "Lifestyle Tech", "Documentos", "Indisponível"];
  const container = document.getElementById("filters");
  order.forEach(cat => {
    if (!counts[cat]) return;
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (cat === "Todos" ? " active" : "");
    btn.dataset.cat = cat;
    const emoji = catConfig[cat] ? catConfig[cat].emoji + " " : "";
    btn.innerHTML = `${emoji}${cat} <span class="count">${counts[cat]}</span>`;
    btn.onclick = () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderCards();
    };
    container.appendChild(btn);
  });
}

function buildSummary() {
  const iaCount = items.filter(i => i.categoria.startsWith("IA")).length;
  const altaCount = items.filter(i => i.utilidade === "Alta").length;
  const totalEngagement = items.reduce((s, i) => {
    const n = parseFloat((i.likes || "0").replace(".", "").replace("K", "000").replace(",", "")) || 0;
    return s + n;
  }, 0);
  const container = document.getElementById("summary");
  container.innerHTML = `
    <div class="summary-chip">📊 <strong>${items.length}</strong> itens analisados</div>
    <div class="summary-chip">🤖 <strong>${iaCount}</strong> sobre IA / Claude</div>
    <div class="summary-chip">⭐ <strong>${altaCount}</strong> de utilidade alta</div>
    <div class="summary-chip">❌ <strong>1</strong> link removido</div>
  `;
}

function renderCards() {
  const activeCat = document.querySelector(".filter-btn.active")?.dataset.cat || "Todos";
  const search = document.getElementById("search").value.toLowerCase();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  let count = 0;

  items.forEach((item, idx) => {
    const mc = getMainCat(item.categoria);
    if (activeCat !== "Todos" && mc !== activeCat) return;
    if (search && ![item.conta, item.titulo, item.descricao, item.categoria].join(" ").toLowerCase().includes(search)) return;

    const cfg = catConfig[item.categoria] || { emoji: "📌", cls: "cat-na" };
    const card = document.createElement("div");
    card.className = "card";

    const stepsHtml = (item.passos || []).map(p => `<li>${p}</li>`).join("");
    const statsHtml = item.likes !== "—" ? `
      <div class="stats">
        <span class="stat">❤️ <span class="num">${item.likes}</span></span>
        <span class="stat">💬 <span class="num">${item.comentarios}</span></span>
        <span class="stat">🔄 <span class="num">${item.shares}</span></span>
      </div>` : '';

    card.innerHTML = `
      <div class="card-header">
        <div>
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            <span class="cat-badge ${cfg.cls}">${cfg.emoji} ${item.categoria}</span>
            <span class="utilidade-tag ${utilConfig[item.utilidade] || 'util-na'}">${item.utilidade}</span>
          </div>
          <div class="card-title">${item.titulo}</div>
        </div>
      </div>
      <div class="card-body">
        <a class="account" href="${item.link}" target="_blank">${item.conta} ↗</a>
        <div class="descricao">${item.descricao}</div>
        ${item.cta !== "N/A" ? `<div class="cta-box">💬 "${item.cta}"</div>` : ''}
        ${statsHtml}
        <button class="expand-btn" onclick="toggleImpl(this)">
          <span class="arrow">▶</span> Como usar & Implementação
        </button>
        <div class="implementation">
          <div class="impl-section">
            <div class="impl-label">🎯 Como usar</div>
            <div class="impl-text">${item.uso}</div>
          </div>
          <div class="impl-section">
            <div class="impl-label">📋 Passo a passo</div>
            <ol class="impl-steps">${stepsHtml}</ol>
          </div>
          ${item.alternativas ? `<div class="impl-section"><div class="impl-label">🔄 Alternativas</div><div class="alt-box">${item.alternativas}</div></div>` : ''}
          <a class="link-btn" href="${item.link}" target="_blank">🔗 Abrir link original</a>
        </div>
      </div>
    `;
    grid.appendChild(card);
    count++;
  });

  if (count === 0) {
    grid.innerHTML = '<div class="empty-state">Nenhum item encontrado para este filtro.</div>';
  }
}

function toggleImpl(btn) {
  btn.classList.toggle("open");
  const impl = btn.nextElementSibling;
  impl.classList.toggle("show");
}

buildFilters();
buildSummary();
renderCards();
</script>
